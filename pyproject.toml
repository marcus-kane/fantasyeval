[project]
name = "fantasyeval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "espn-api==0.46.0",  # unofficial API, pinned: bump deliberately,
    "playwright>=1.63.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
